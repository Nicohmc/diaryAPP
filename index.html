<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日常收藏家</title>
<meta name="theme-color" content="#F2E8E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2B2429" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日常收藏家">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2E8E6; --dot:#E6D6D3; --surface:#FFFAF8; --ink:#4D3F47; --muted:#8E7E87; --line:#E8D9D6; --accent:#C48A92; --accent-ink:#FFFFFF;
  --w5:#DCC5E0; --w4:#EDD69C; --w3:#CCD3D6; --w2:#AFC8D3; --w1:#BDB4CC;
  --sage:#B7C9AC; --sage-d:#8FA885; --peach:#F1CDBB; --sky:#D7E4EA; --note-ink:#3F353B;
  --shadow:0 2px 0 rgba(77,63,71,.08),0 10px 18px -12px rgba(77,63,71,.45);
  --round:"Huninn","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --hand:"LXGW WenKai TC","Kaiti TC","BiauKai",serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#2B2429; --dot:#352C32; --surface:#362E34; --ink:#F3E8EB; --muted:#BBA9B2; --line:#4B3F46; --accent:#D9A3AB; --accent-ink:#2B2429;
    --w5:#C9B0CE; --w4:#D8BF84; --w3:#B7BFC3; --w2:#97B3C0; --w1:#A99FBA;
    --sage:#8FA585; --sage-d:#728A69; --peach:#D9AE99; --sky:#3E4A52; --note-ink:#2E262B;
    --shadow:0 10px 18px -10px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#2B2429; --dot:#352C32; --surface:#362E34; --ink:#F3E8EB; --muted:#BBA9B2; --line:#4B3F46; --accent:#D9A3AB; --accent-ink:#2B2429;
  --w5:#C9B0CE; --w4:#D8BF84; --w3:#B7BFC3; --w2:#97B3C0; --w1:#A99FBA;
  --sage:#8FA585; --sage-d:#728A69; --peach:#D9AE99; --sky:#3E4A52; --note-ink:#2E262B;
  --shadow:0 10px 18px -10px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; color:var(--ink); background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 2px,transparent 2.5px); background-size:22px 22px;
  font-family:var(--round); font-size:16px; line-height:1.6; min-height:100%;
}
button{font:inherit; color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.wrap{max-width:980px; margin:0 auto; padding:18px 16px calc(110px + env(safe-area-inset-bottom,0px))}
header{display:flex; align-items:center; gap:10px; margin-bottom:14px}
header h1{font-size:1.6rem; margin:0; font-weight:400; letter-spacing:.05em}
header .logo{width:40px; height:40px; border-radius:14px; background:var(--w4); display:grid; place-items:center; font-size:1.3rem; transform:rotate(-6deg)}
.sync{font-size:.75rem; color:var(--muted)}
.tab{display:none}
.tab.on{display:block}
.card{background:var(--surface); border:2px solid var(--line); border-radius:22px; padding:16px}
.card + .card{margin-top:14px}
h2{font-size:1.15rem; font-weight:400; margin:0 0 10px}
.muted{color:var(--muted)}
.btn{border:2px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 14px; cursor:pointer; min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.icon{width:38px; padding:0}
.btn.main{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.soft{background:var(--bg); border-color:transparent}
.btn:disabled{opacity:.55; cursor:default}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.grow{flex:1}

/* diary */
@media (min-width:820px){ .diary{display:grid; grid-template-columns:350px 1fr; gap:28px; align-items:start} .diary .side{position:sticky; top:calc(14px + env(safe-area-inset-top,0px))} }
.cal-head{display:flex; align-items:center; gap:6px; margin-bottom:8px}
.cal-head .month{flex:1; font-size:1.15rem}
.dow,.days{display:grid; grid-template-columns:repeat(7,1fr); text-align:center}
.dow span{font-size:.78rem; color:var(--muted); padding-bottom:4px}
.day{border:0; background:none; cursor:pointer; padding:3px 0; display:flex; flex-direction:column; align-items:center; min-height:50px; border-radius:12px}
.day:hover{background:var(--bg)}
.day.blank{visibility:hidden}
.day .n{width:30px; height:30px; line-height:30px; border-radius:11px; font-size:.92rem; color:var(--ink)}
.day.has .n{color:var(--note-ink)}
.day.today .n{text-decoration:underline 2px var(--accent); text-underline-offset:3px}
.day.sel .n{box-shadow:0 0 0 2.5px var(--ink)}
.day .w{font-size:.72rem; height:14px; line-height:14px}
.quest{display:flex; gap:12px; align-items:center; background:var(--peach); color:var(--note-ink); border-radius:18px; padding:12px 14px; margin-bottom:16px}
.quest .qe{font-size:1.8rem}
.quest small{display:block; opacity:.75}
.quest .btn{background:rgba(255,255,255,.6); border-color:transparent; color:var(--note-ink); white-space:nowrap}
.drinkwrap .quickhint{margin:0 0 10px}
.dgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.dbtn{border:2px solid var(--line); background:var(--surface); border-radius:16px; padding:8px 2px 6px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:.72rem; color:var(--muted); min-height:64px}
.dbtn b{font-size:1.7rem; font-weight:400; line-height:1.2}
.dbtn:active{transform:scale(.94)}
.dcard{display:flex; align-items:center; gap:12px; width:100%; text-align:left; border:0; border-radius:18px; padding:12px; margin-bottom:10px; cursor:pointer; color:var(--note-ink); box-shadow:var(--shadow)}
.dcard .de{font-size:2rem; line-height:1}
.dcard .dt{flex:1; min-width:0}
.dcard .dt strong{font-weight:400; font-size:1rem; display:block}
.dcard .dt small{display:block; opacity:.75; font-size:.78rem; word-break:break-word}
.dthumb,.dph{width:64px; height:64px; border-radius:12px; flex:none}
.dthumb{object-fit:cover; border:3px solid rgba(255,255,255,.7)}
.dph{background:rgba(255,255,255,.45); display:grid; place-items:center; font-size:1.2rem}
.day.dhas .n{background:var(--peach); color:var(--note-ink)}
.day:disabled{opacity:.35; cursor:default}
.dicons{display:grid; grid-template-columns:repeat(8,1fr); gap:6px; margin-bottom:10px}
.dicons button{border:2px solid transparent; border-radius:12px; padding:3px 0; font-size:1.35rem; line-height:1.4; cursor:pointer; background:var(--bg)}
.dicons button[aria-pressed="true"]{border-color:var(--ink); background:var(--peach)}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(88px + env(safe-area-inset-bottom,0px)); z-index:30; background:var(--ink); color:var(--surface); border-radius:999px; padding:6px 8px 6px 16px; display:flex; align-items:center; gap:10px; font-size:.9rem; box-shadow:0 8px 20px -8px rgba(0,0,0,.5); max-width:92vw}
.toast[hidden]{display:none}
.toast .btn{min-height:30px; padding:2px 12px; background:var(--surface); color:var(--ink); border-color:transparent}
.drinkwrap{display:flex; flex-direction:column}
.drinkwrap > .side{order:2; margin-top:16px}
@media (min-width:820px){ .drinkwrap{display:grid; grid-template-columns:350px 1fr; gap:28px; align-items:start} .drinkwrap > .side{order:0; margin-top:0; position:sticky; top:calc(14px + env(safe-area-inset-top,0px))} }
.seg{display:grid; grid-template-columns:repeat(3,1fr); background:var(--surface); border:2px solid var(--line); border-radius:999px; padding:4px; margin-bottom:12px}
.seg button{border:0; background:none; border-radius:999px; padding:7px 0; cursor:pointer; font-size:.9rem; color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--ink); color:var(--surface)}
.btsum{font-size:.85rem; color:var(--muted); margin:0 0 10px}
.pills{display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:6px; scrollbar-width:none}
.pills .chip{white-space:nowrap; flex:none}
.slip{background:var(--surface); border:2px solid var(--line); border-radius:22px; padding:14px 14px 12px; margin-bottom:12px}
.slip-top{display:flex; justify-content:space-between; align-items:center; font-size:.82rem; color:var(--muted)}
.slip .shopt{background:var(--peach); color:var(--note-ink); border-radius:999px; padding:2px 10px}
.slip-body{display:flex; gap:12px; align-items:center; margin-top:10px}
.slip-main{flex:1; min-width:0}
.drk{font-family:var(--hand); font-size:1.2rem; line-height:1.4; word-break:break-word}
.stars{color:#D2A64C; letter-spacing:1px; font-size:.95rem}
.stars .off{color:var(--line)}
.stamps{display:flex; gap:4px; flex:none}
.stamp{width:50px; height:50px; border-radius:50%; display:grid; place-items:center; text-align:center; font-size:.7rem; line-height:1.15; padding:3px; color:var(--note-ink); background:var(--w4); border:2px dashed rgba(63,53,59,.22); transform:rotate(-8deg)}
.stamp.ice{background:var(--w2); transform:rotate(7deg)}
.bnote{font-size:.85rem; background:var(--bg); border-radius:12px; padding:8px 10px; margin:10px 0 0; word-break:break-word}
.slip-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:10px}
.slip-actions .btn{min-height:34px; padding:3px 14px; font-size:.88rem}
.bestsec{background:var(--surface); border:2px solid var(--line); border-radius:22px; padding:12px 14px; margin-bottom:12px}
.bestsec h3{margin:0 0 4px; font-weight:400; font-size:1.05rem}
.brow{display:flex; gap:10px; align-items:center; padding:10px 0; border-top:1px dashed var(--line)}
.brow .nm{font-family:var(--hand); font-size:1.05rem}
.brow .spec,.brow .tip{font-size:.78rem; color:var(--muted)}
.brow .avg{color:#B98E37; font-size:.9rem; text-align:right; margin-bottom:4px}
.brow .btn{min-height:32px; padding:2px 10px; font-size:.82rem; white-space:nowrap}
.bsec{margin-bottom:16px}
.lg{display:block; font-size:.85rem; color:var(--muted); margin-bottom:6px}
.bchips{display:flex; flex-wrap:wrap; gap:6px}
.bchips .chip small{opacity:.6; margin-left:3px; font-size:.78em}
.bchips .fav{color:#B98E37; margin-left:4px; font-size:.8em}
.mlabel{font-size:.75rem; color:var(--muted); margin:12px 0 6px}
.bin{display:block; width:100%; font:inherit; font-size:1rem; color:var(--ink); background:var(--bg); border:2px solid transparent; border-radius:12px; padding:9px 12px}
.bin[hidden]{display:none}
.toast > span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
textarea.bin{min-height:76px; resize:vertical; font-family:var(--hand)}
.picked{display:flex; align-items:center; gap:10px; background:var(--bg); border-radius:14px; padding:8px 12px}
.picked .pk{flex:1; font-size:1.05rem}
.linkbtn{border:0; background:none; color:var(--accent); cursor:pointer; text-decoration:underline; font:inherit; font-size:.9rem}
.starpick button{border:0; background:none; font-size:2rem; line-height:1; color:var(--line); cursor:pointer; padding:0 2px}
.starpick button.on{color:#D2A64C}
#starLbl{margin-left:8px; color:var(--ink)}
.hintbox{background:var(--peach); color:var(--note-ink); border-radius:14px; padding:10px 12px; font-size:.85rem; margin-bottom:14px}
.hintbox small{display:block; opacity:.75; margin-top:4px}
.bprev[hidden]{display:none}
.bprev{display:block; max-width:100%; max-height:200px; border-radius:10px; border:4px solid var(--bg); margin-bottom:8px}
.dim{opacity:.55}
.bttoggle{display:flex; align-items:center; gap:12px; background:var(--bg); border-radius:16px; padding:12px 14px; margin-bottom:16px; cursor:pointer}
.bttoggle input{position:absolute; opacity:0; width:1px; height:1px}
.bttoggle .sw{flex:none; width:46px; height:28px; border-radius:999px; background:var(--line); position:relative; transition:background .2s}
.bttoggle .sw::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.2); transition:transform .2s}
.bttoggle input:checked + .sw{background:var(--accent)}
.bttoggle input:checked + .sw::after{transform:translateX(18px)}
.bttoggle input:focus-visible + .sw{outline:3px solid var(--accent); outline-offset:2px}
.bttoggle .tt{font-size:.98rem}
.bttoggle .tt small{display:block; color:var(--muted); font-size:.76rem; margin-top:2px}
#plainSec[hidden],#btSec[hidden]{display:none}
.dice-stage{text-align:center; padding:22px 0 8px}
.dice-face{font-size:3.4rem; display:inline-block}
.dice-face.rolling{animation:diceSpin .45s linear infinite}
@keyframes diceSpin{to{transform:rotate(360deg)}}
.dice-name{font-family:var(--hand); font-size:1.5rem; margin-top:8px; min-height:2.1em}
.dice-sub{font-size:.85rem; color:var(--muted); min-height:1.3em}
.daytitle{display:flex; align-items:baseline; gap:10px; margin:4px 0 14px}
.daytitle h2{font-family:var(--hand); font-size:1.5rem; margin:0}
.wall{display:grid; grid-template-columns:1fr; gap:16px; max-width:560px}
.note{
  display:block; width:100%; text-align:left; border:0; cursor:pointer; margin:6px 0 0;
  padding:12px 12px 10px; color:var(--note-ink); border-radius:4px 4px 14px 4px; box-shadow:var(--shadow); position:relative
}
.note::before{content:""; position:absolute; top:-7px; left:50%; width:44px; height:12px; margin-left:-22px; background:rgba(255,255,255,.5); border-radius:3px; transform:rotate(-3deg)}
.note .top{display:flex; justify-content:space-between; align-items:center; font-size:.72rem; opacity:.8; margin-bottom:4px}
.note .top b{font-size:1rem; line-height:1}
.note img{display:block; width:100%; border-radius:6px; margin-bottom:8px; border:4px solid rgba(255,255,255,.7)}
.pph{display:grid; place-items:center; min-height:84px; border-radius:6px; margin-bottom:8px; background:rgba(255,255,255,.45); font-size:.78rem; text-align:center; padding:8px; opacity:.85}
.note p{margin:0; font-family:var(--hand); font-size:.88rem; line-height:1.6; white-space:pre-wrap; word-break:break-word}
.note .meta{margin-top:6px; font-size:.68rem; opacity:.75; line-height:1.5}
.empty{color:var(--muted); font-family:var(--hand); font-size:1.1rem; padding:20px 4px}
.wbar{display:flex; height:14px; border-radius:7px; overflow:hidden; background:var(--bg); margin-top:6px}
.wbar span{height:100%}
.legend{display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:8px; font-size:.82rem; color:var(--muted)}

.fab{
  position:fixed; right:18px; bottom:calc(84px + env(safe-area-inset-bottom,0px)); width:62px; height:62px; border-radius:22px;
  border:0; background:var(--accent); color:var(--accent-ink); font-size:2rem; cursor:pointer; box-shadow:0 10px 20px -8px rgba(77,63,71,.55); z-index:6; transform:rotate(-4deg)
}
.fab[hidden]{display:none}

/* nav */
nav{
  position:fixed; left:0; right:0; bottom:0; z-index:8; background:var(--surface); border-top:2px solid var(--line);
  padding:6px 6px env(safe-area-inset-bottom,0px); display:flex; justify-content:center
}
nav .in{display:grid; grid-template-columns:repeat(6,1fr); width:100%; max-width:560px}
nav button{border:0; background:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; padding:4px 0 6px; font-size:.72rem; color:var(--muted); border-radius:14px}
nav button b{font-size:1.35rem; line-height:1.3; font-weight:400}
nav button[aria-current="page"]{color:var(--ink); background:var(--bg)}

/* gacha */
.machine{width:220px; margin:12px auto 0; position:relative}
.dome{width:200px; height:200px; margin:0 auto; border-radius:50%; background:radial-gradient(circle at 50% 30%, var(--surface), var(--sky) 72%); border:6px solid var(--surface); box-shadow:0 0 0 2px var(--line); position:relative; overflow:hidden; z-index:1}
.dome::after{content:""; position:absolute; left:30px; top:20px; width:46px; height:24px; border-radius:50%; background:rgba(255,255,255,.65); transform:rotate(-32deg); pointer-events:none; z-index:3}
.cap{position:absolute; width:40px; height:40px; border-radius:50%; background:linear-gradient(to bottom, rgba(255,255,255,.9) 0 47%, rgba(0,0,0,.12) 47% 53%, var(--cc) 53%); box-shadow:inset 0 0 0 2px rgba(0,0,0,.06), inset -4px -5px 0 rgba(0,0,0,.07)}
.neck{width:110px; height:14px; margin:-6px auto 0; background:var(--accent); filter:brightness(.88); border-radius:4px}
.base{width:180px; height:92px; margin:0 auto; background:var(--accent); border-radius:12px 12px 20px 20px; position:relative; box-shadow:inset 0 -6px 0 rgba(0,0,0,.1)}
.knob{position:absolute; left:22px; top:20px; width:50px; height:50px; border-radius:50%; border:0; padding:0; background:var(--surface); cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.18)}
.knob::before{content:""; position:absolute; left:50%; top:5px; bottom:5px; width:12px; margin-left:-6px; border-radius:6px; background:var(--accent)}
.chute{position:absolute; right:22px; top:22px; width:56px; height:54px; border-radius:12px 12px 6px 6px; background:rgba(0,0,0,.28); box-shadow:inset 0 6px 8px rgba(0,0,0,.25)}
.out{position:absolute; right:30px; top:32px; width:40px; height:40px; z-index:2}
.out[hidden]{display:none}
.out .t,.out .b{position:absolute; left:0; width:40px; height:20px}
.out .t{top:0; border-radius:20px 20px 0 0; background:rgba(255,255,255,.95)}
.out .b{top:20px; border-radius:0 0 20px 20px; background:var(--cc)}
.chips{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:16px 0 10px}
.chip{border:2px solid var(--line); background:var(--surface); border-radius:999px; padding:4px 12px; cursor:pointer; font-size:.9rem}
.chip.emo{font-size:1.05rem; padding:3px 11px}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.result{max-width:360px; margin:16px auto 0; animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.6); opacity:0}}
.ago{text-align:center; font-size:.9rem; color:var(--muted); margin-bottom:4px}

/* planet */
.planet svg{display:block; width:100%; max-width:380px; margin:0 auto}
.bob{animation:bob 4s ease-in-out infinite; transform-origin:center}
@keyframes bob{50%{transform:translateY(-5px)}}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; text-align:center}
.stats div{background:var(--bg); border-radius:14px; padding:8px 4px}
.stats b{display:block; font-size:1.3rem; font-weight:400}
.stats span{font-size:.75rem; color:var(--muted)}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px}
.qcard{border-radius:16px; padding:12px; color:var(--note-ink); background:var(--w5); min-height:120px; display:flex; flex-direction:column; gap:4px; box-shadow:var(--shadow)}
.qcard .e{font-size:1.8rem}
.qcard small{opacity:.7; margin-top:auto}

/* letters */
.letter{border-radius:18px; padding:14px; display:flex; gap:12px; align-items:flex-start; background:var(--bg)}
.letter + .letter{margin-top:10px}
.letter .e{font-size:1.8rem}
.letter p{font-family:var(--hand); white-space:pre-wrap; margin:6px 0 0; line-height:1.75}

/* report */
.big{font-size:2.2rem; line-height:1.1}
.grid2{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.stat{background:var(--bg); border-radius:16px; padding:12px}
.stat .big{display:block; margin-bottom:2px}
.forecast{font-family:var(--hand); font-size:1.08rem; line-height:1.8; white-space:pre-wrap}
.movie{margin-top:10px; padding:10px 14px; border-radius:14px; background:var(--ink); color:var(--surface); font-family:var(--hand); font-size:1.15rem}
.place{width:100%; text-align:left; border:0; background:var(--bg); border-radius:14px; padding:10px 14px; cursor:pointer; display:flex; gap:8px; margin-top:8px}
.place-notes{padding:8px 4px 0}

/* sheet */
.scrim{position:fixed; inset:0; background:rgba(45,35,42,.45); display:none; align-items:flex-end; justify-content:center; z-index:20}
.scrim.open{display:flex}
.sheet{width:100%; max-width:540px; background:var(--surface); border-radius:26px 26px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px)); max-height:92vh; overflow:auto; animation:up .25s ease-out}
@media (min-width:620px){ .scrim{align-items:center} .sheet{border-radius:26px; padding-bottom:18px} }
@keyframes up{from{transform:translateY(30px); opacity:0}}
.sheet h3{margin:0 0 12px; font-weight:400; font-size:1.15rem}
.weathers{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px}
@media (min-width:480px){ .weathers{grid-template-columns:repeat(6,1fr)} }
.custom{background:var(--bg); border-radius:16px; padding:10px 12px; margin-bottom:12px}
.emo-field{display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--muted)}
.emo-field input{width:52px; height:42px; text-align:center; font-size:1.4rem; border:2px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); padding:0}
.emo-field input[type=color]{padding:3px; cursor:pointer}
.swatches{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.sw{width:30px; height:30px; border-radius:50%; border:2px solid rgba(255,255,255,.85); cursor:pointer; box-shadow:0 0 0 1px var(--line); padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.wbtn{border:3px solid transparent; border-radius:16px; padding:6px 0 4px; cursor:pointer; color:var(--note-ink); display:flex; flex-direction:column; align-items:center; font-size:.75rem}
.wbtn b{font-size:1.5rem; font-weight:400; line-height:1.3}
.wbtn[aria-pressed="true"]{border-color:var(--ink); transform:translateY(-2px)}
.askbox{display:flex; gap:8px; align-items:flex-start; margin-bottom:10px}
.askq{flex:1; font-family:var(--hand); font-size:1rem; color:var(--muted); min-height:1.5em}
.paper{border-radius:6px 6px 18px 6px; padding:12px; transition:background .2s}
textarea{width:100%; min-height:130px; border:0; background:transparent; resize:vertical; font-family:var(--hand); font-size:1.1rem; line-height:1.75; color:var(--note-ink)}
textarea::placeholder{color:rgba(0,0,0,.42)}
.paper img{display:block; max-width:100%; max-height:220px; border-radius:6px; border:4px solid rgba(255,255,255,.7); margin-bottom:8px}
.field{display:block; margin-top:10px; font-size:.85rem; color:var(--muted)}
.field input,.field select{display:block; width:100%; margin-top:4px; font:inherit; font-size:1rem; color:var(--ink); background:var(--bg); border:2px solid transparent; border-radius:12px; padding:8px 12px}
.field[hidden]{display:none}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.actions{display:flex; gap:8px; margin-top:16px; align-items:center}
.danger{color:#B05A5A; border-color:transparent; background:transparent}
.err{color:#B05A5A; font-size:.85rem; min-height:1.2em; margin-top:8px}
.qbanner{background:var(--peach); color:var(--note-ink); border-radius:12px; padding:6px 12px; margin-bottom:10px; font-size:.9rem}
.rainbow-btn{display:block; width:100%; border:0; cursor:pointer; border-radius:18px; padding:12px 14px; margin-bottom:12px; color:var(--note-ink); font-size:1rem; text-align:left;
  background:linear-gradient(110deg,#E8BFC4,#F1C7AE,#EDD69C,#BCCDAF,#B9CFD9,#CFC6DD); box-shadow:var(--shadow)}
.rainbow-btn small{display:block; opacity:.7; font-size:.78rem}
.rcard-wrap{perspective:900px; display:flex; justify-content:center; margin:4px 0 8px}
.rcard{width:230px; height:310px; position:relative; transform-style:preserve-3d; transition:transform .8s cubic-bezier(.3,.7,.2,1); cursor:pointer; border:0; padding:0; background:none}
.rcard.flip{transform:rotateY(180deg)}
.face{position:absolute; inset:0; border-radius:18px; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:22px; text-align:center; box-shadow:var(--shadow)}
.face.back{font-size:3.4rem; border:6px solid #FFFAF8}
.face.front{transform:rotateY(180deg); color:#3F353B; background:#FFFAF8; border:8px solid var(--tc,#E8BFC4)}
.tlabel{font-size:.75rem; padding:2px 10px; border-radius:999px; background:var(--tc,#E8BFC4); color:#3F353B; margin-bottom:16px}
.tchips{margin:0 0 8px; gap:5px}
.tchip{font-size:.8rem; padding:3px 9px; display:inline-flex; align-items:center; gap:5px}
.tchip i{width:10px; height:10px; border-radius:50%; display:inline-block}
.rc-in .tl{font-size:.7rem; opacity:.7; margin-bottom:2px}
.face .zh{font-family:var(--hand); font-size:1.22rem; line-height:1.7; margin:0 0 14px}
.face .en{font-size:.88rem; line-height:1.55; margin:0; color:#7A6C73; font-style:italic}
.face .mark{font-size:1.4rem; margin-bottom:10px}
.rc-in{background:rgba(255,255,255,.6); border-radius:10px; padding:10px 12px; margin-bottom:6px}
.rc-in .zh{font-family:var(--hand); font-size:.95rem; line-height:1.6}
.rc-in .en{font-size:.78rem; font-style:italic; opacity:.75; margin-top:4px; line-height:1.45}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} .note{transform:none!important} }
</style>
</head>

<script>
/* ---------- 基本資料 ---------- */
const MOODS = [
  {k:"happy",    e:"😄", n:"開心", v:5, c:"#EDD69C"},
  {k:"love",     e:"🥰", n:"幸福", v:5, c:"#E8BFC4"},
  {k:"excited",  e:"🤩", n:"興奮", v:5, c:"#F1C7AE"},
  {k:"calm",     e:"😌", n:"平靜", v:4, c:"#BCCDAF"},
  {k:"touched",  e:"🥹", n:"感動", v:4, c:"#E5D4B5"},
  {k:"proud",    e:"😎", n:"得意", v:4, c:"#B9CFD9"},
  {k:"meh",      e:"😐", n:"普通", v:3, c:"#D8D0C9"},
  {k:"tired",    e:"😪", n:"好累", v:3, c:"#CBD0D3"},
  {k:"confused", e:"🤔", n:"迷惘", v:3, c:"#CFC6DD"},
  {k:"sad",      e:"😢", n:"難過", v:2, c:"#A9C1CF"},
  {k:"anxious",  e:"😰", n:"焦慮", v:2, c:"#B9B2CB"},
  {k:"angry",    e:"😤", n:"生氣", v:1, c:"#D4A6A1"}
];
const OLD_MOOD = {5:"excited",4:"happy",3:"meh",2:"sad",1:"anxious"};
const mByK = k => MOODS.find(m => m.k === k);
const moodOf = n => {
  const base = mByK(n.emo) || mByK(OLD_MOOD[n.mood]) || mByK("meh");
  const e = n.emoji || base.e, preset = MOODS.find(m => m.e === e);
  return {k:e, e, n: preset ? preset.n : "", v: n.mood || base.v, c: n.color || base.c};
};
const PALETTE = [
  ["#EDD69C","奶油芥末"],["#F1C7AE","蜜桃"],["#E8BFC4","乾燥玫瑰"],["#E3C9B8","杏仁奶茶"],
  ["#D4A6A1","磚紅粉"],["#E5D4B5","燕麥"],["#D8C3A5","焦糖拿鐵"],["#C9B79C","駝色"],
  ["#BCCDAF","鼠尾草"],["#C6D1B8","抹茶牛奶"],["#A9BFB0","灰綠"],["#B9CFD9","霧天藍"],
  ["#A9C1CF","灰藍"],["#CFC6DD","淡薰衣草"],["#D9C5D6","藕荷粉"],["#D8D0C9","燕麥灰"]
];
const QUESTS = [

/* ---------- 儲存（本機暫存 + Google 試算表同步） ---------- */
const API_DEFAULT = "https://script.google.com/macros/s/AKfycbzGvZNm5NZjusudO190sSI73gGNSPCCFwWVhsE_BJxwm6X_wBzlkeNUctVgZ9jlMlERFw/exec";
const LS = {items:"sd-items", queue:"sd-queue", cfg:"sd-config"};
let cfg = {url:API_DEFAULT, key:""};
let queue = [];            // 還沒送到試算表的操作
let syncState = "idle";    // idle | syncing | offline | auth | error
let syncing = false, lastSync = 0, syncErr = "", drinkOk = false;

function lsGet(k, d){ try{ const r=localStorage.getItem(k); return r ? JSON.parse(r) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function loadLocal(){
  items = lsGet(LS.items, []); queue = lsGet(LS.queue, []);
  const c = lsGet(LS.cfg, null); if(c) cfg = {url:c.url || API_DEFAULT, key:c.key || ""};
}
function saveLocal(){ return lsSet(LS.items, items) && lsSet(LS.queue, queue); }

function showStatus(){
  const n = queue.length; let t;
  if(!cfg.key) t = "尚未連接 Google 試算表，目前只存在這台裝置";
  else if(syncState==="syncing") t = "同步中…";
  else if(syncState==="auth") t = "密碼不對，請到右上角 ⚙️ 重新輸入";
  else if(syncState==="offline") t = n ? `離線中，${n} 筆等有網路再同步` : "離線中";
  else if(syncState==="error"){ const h = /未知的動作/.test(syncErr) ? "Code.gs 還沒更新" : syncErr; t = `同步失敗${h ? "（" + h + "）" : ""}${n ? "，" + n + " 筆稍後重試" : "，稍後重試"}`; }
  else t = n ? `${n} 筆待同步` : "☁️ 已同步到 Google 試算表";
  $("sync").textContent = t;
}
async function api(body){
  const res = await fetch(cfg.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({...body, key:cfg.key}), redirect:"follow"});
  if(!res.ok) throw new Error("http " + res.status);
  const data = await res.json();
  if(!data.ok){ const e = new Error(data.error || "fail"); e.server = true; throw e; }
  return data;
}
async function sync(){
  if(syncing) return;
  if(!cfg.key){ showStatus(); return; }
  if(!navigator.onLine){ syncState="offline"; showStatus(); return; }
  syncing = true; syncState = "syncing"; syncErr = ""; showStatus();
  try{
    while(queue.length){
      const op = queue[0];
      if(op.op==="save" && op.item.kind==="drink" && !drinkOk){ await api({action:"version"}); drinkOk = true; }  // 舊版 Code.gs 沒有飲料分頁，先確認
      if(op.op==="save" && op.item.photoRef && !op.item.photoId){
        const ref = op.item.photoRef, id = op.item.id, url = await idbGet(ref);
        if(url){
          const r = await api({action:"uploadPhoto", noteId:id, data:url.split(",")[1]});
          await idbSet("id:" + r.fileId, url); await idbDel(ref);
          const fix = x => { if(x.id===id && x.photoRef===ref){ x.photoId = r.fileId; delete x.photoRef; } };
          queue.forEach(q => { if(q.op==="save") fix(q.item); }); items.forEach(fix);
        }else{
          const drop = x => { if(x.id===id && x.photoRef===ref) delete x.photoRef; };
          queue.forEach(q => { if(q.op==="save") drop(q.item); }); items.forEach(drop);
        }
        lsSet(LS.items, items); lsSet(LS.queue, queue);
      }
      await api(op.op==="delete" ? {action:"delete", id:op.id} : {action:"save", item:op.item});
      const k = queue.indexOf(op); if(k >= 0) queue.splice(k, 1);
      lsSet(LS.queue, queue);
    }
    const d = await api({action:"list"});
    const map = new Map();
    d.notes.concat(d.letters, d.drinks || []).forEach(x => map.set(x.id, x));
    queue.forEach(q => { if(q.op==="delete") map.delete(q.id); else map.set(q.item.id, q.item); });
    items = Array.from(map.values());
    lsSet(LS.items, items);
    syncState = "idle"; lastSync = Date.now();
  }catch(e){
    syncErr = e.server ? e.message : "";
    syncState = e.server ? (e.message==="密碼不對" ? "auth" : "error") : (navigator.onLine ? "error" : "offline");
  }finally{
    syncing = false; showStatus(); render();
    if(syncState==="auth") openSettings("密碼不對，請重新輸入。");
  }
}
async function persist(it){
  const prevItems = items.slice(), prevQ = queue.slice();
  const i = items.findIndex(x => x.id === it.id);
  if(i >= 0) items[i] = it; else items.push(it);
  queue = queue.filter(q => !(q.op==="save" && q.item.id===it.id)).concat({op:"save", item:it});
  if(!saveLocal()){ items = prevItems; queue = prevQ; throw new Error("full"); }
  render(); showStatus(); sync();
}
async function removeItem(id){
  const gone = items.find(x => x.id === id); if(gone && photoKey(gone)) idbDel(photoKey(gone));
  items = items.filter(x => x.id !== id);
  queue = queue.filter(q => !(q.op==="save" && q.item.id===id)).concat({op:"delete", id});
  saveLocal(); render(); showStatus(); sync();
}

/* ---------- 照片（本機暫存 + Google 雲端硬碟） ---------- */
const memPhotos = new Map();
const idbP = new Promise(res => { try{ const r=indexedDB.open("sd-photos",1); r.onupgradeneeded=()=>r.result.createObjectStore("p"); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null); }catch(e){ res(null); } });
async function idbGet(k){ const db=await idbP; if(!db) return memPhotos.get(k)||null; return new Promise(r=>{ try{ const q=db.transaction("p").objectStore("p").get(k); q.onsuccess=()=>r(q.result||null); q.onerror=()=>r(null); }catch(e){ r(null); } }); }
async function idbSet(k,v){ const db=await idbP; if(!db){ memPhotos.set(k,v); return true; } return new Promise(r=>{ try{ const t=db.transaction("p","readwrite"); t.objectStore("p").put(v,k); t.oncomplete=()=>r(true); t.onerror=()=>{ memPhotos.set(k,v); r(false); }; }catch(e){ memPhotos.set(k,v); r(false); } }); }
async function idbDel(k){ memPhotos.delete(k); const db=await idbP; if(!db) return; return new Promise(r=>{ try{ const t=db.transaction("p","readwrite"); t.objectStore("p").delete(k); t.oncomplete=()=>r(); t.onerror=()=>r(); }catch(e){ r(); } }); }
async function idbClear(){ memPhotos.clear(); const db=await idbP; if(!db) return; return new Promise(r=>{ try{ const t=db.transaction("p","readwrite"); t.objectStore("p").clear(); t.oncomplete=()=>r(); t.onerror=()=>r(); }catch(e){ r(); } }); }
const photoKey = n => n.photoId ? "id:" + n.photoId : (n.photoRef || null);
const photoJobs = new Map(), photoWait = []; let photoBusy = 0;
const photoSlot = () => new Promise(r => { if(photoBusy < 3){ photoBusy++; r(); } else photoWait.push(r); });
const photoFree = () => { const nx = photoWait.shift(); if(nx) nx(); else photoBusy--; };
async function photoGet(n){
  const key = photoKey(n); if(!key) return null;
  const hit = await idbGet(key); if(hit) return hit;
  if(!n.photoId || !cfg.key || !navigator.onLine) return null;
  if(photoJobs.has(key)) return photoJobs.get(key);
  const job = (async () => {
    await photoSlot();
    try{ const d = await api({action:"getPhoto", fileId:n.photoId}); const url = "data:image/jpeg;base64," + d.data; await idbSet(key, url); return url; }
    catch(e){ return null; }
    finally{ photoFree(); photoJobs.delete(key); }
  })();
  photoJobs.set(key, job); return job;
}
function attachPhoto(b, n){
  if(!photoKey(n)) return;
  const ph = el("div","pph","📷 照片載入中…"); b.append(ph);
  photoGet(n).then(url => {
    if(url){ const img = el("img"); img.alt = "便利貼上的照片"; img.src = url; ph.replaceWith(img); }
    else ph.textContent = "📷 有一張照片（連上網路後顯示）";
  });
}

const tilt = id => { let h=0; for(const c of id) h=(h*31+c.charCodeAt(0))|0; return ((Math.abs(h)%3)-1)*0.6; };
function noteCard(n, onClick){

  }

  return b;
}
function weatherBar(list, barEl, legendEl){
  barEl.innerHTML=""; legendEl.innerHTML="";
  const g={}; list.forEach(n => { const m=moodOf(n); (g[m.k]=g[m.k]||{m, c:0}).c++; });
  Object.values(g).sort((a,b)=>b.c-a.c).forEach(({m,c}) => {
    const s=el("span"); s.style.background=m.c; s.style.width=(c/list.length*100)+"%"; barEl.append(s);
    legendEl.append(el("span",null,`${m.e} ${c}`));
  });
  if(!list.length) legendEl.append(el("span",null,"還沒有紀錄"));
}
function dominant(list){
  const g = {}; list.forEach(n => { const m=moodOf(n); (g[m.k]=g[m.k]||{m, c:0}).c++; });
  const top = Object.values(g).sort((a,b)=>b.c-a.c)[0];
  return top ? top.m : null;
}

function renderDiary(){
  const y=view.getFullYear(), m=view.getMonth();
  $("monthLabel").textContent = `${y} 年 ${m+1} 月`;
  const days=$("days"); days.innerHTML="";
  const start=new Date(y,m,1).getDay(), total=new Date(y,m+1,0).getDate(), today=ymd(new Date());
  for(let i=0;i<start;i++) days.append(el("div","day blank"));
  for(let d=1; d<=total; d++){
    const key=`${y}-${pad(m+1)}-${pad(d)}`, list=notesOn(key), dom=dominant(list);
    const b=el("button","day"+(list.length?" has":"")+(key===today?" today":"")+(key===selected?" sel":""));
    b.setAttribute("aria-label", `${m+1} 月 ${d} 日，${list.length} 張便利貼`);
    const n=el("span","n",d); if(dom) n.style.background=dom.c;
    b.append(n, el("span","w", list.length ? dom.e + (list.length>1 ? list.length : "") : ""));
    b.onclick=()=>{ selected=key; render(); if(innerWidth<820) $("dayLabel").scrollIntoView({behavior:"smooth"}); };
    days.append(b);
  }
  const month = notes().filter(n => n.date.startsWith(`${y}-${pad(m+1)}-`));
  $("monthMood").textContent = `${m+1} 月的心情（${month.length} 張）`;
  weatherBar(month, $("monthBar"), $("monthLegend"));

  const q = questFor(selected), done = notesOn(selected).some(n => n.quest);
  const qb = $("quest"); qb.innerHTML="";
  const txt = el("div","grow"); txt.append(el("small",null, selected===today ? "今日小冒險" : "這天的小冒險"), el("span",null,q[1]));
  const btn = el("button","btn", done ? "已收藏 ✓" : "完成了！");
  btn.disabled = done;
  btn.onclick = () => openNote(null, {quest:true});
  qb.append(el("span","qe",q[0]), txt, btn);

  const dt=parse(selected);
  $("dayLabel").textContent = `${dt.getMonth()+1} 月 ${dt.getDate()} 日・星期${"日一二三四五六"[dt.getDay()]}`;
  const list = notesOn(selected);
  $("dayCount").textContent = list.length ? `${list.length} 張` : "";
  const wall=$("wall"); wall.innerHTML="";
  if(!list.length){ wall.append(el("div","empty","這天還空空的。點右下角的「＋」，收藏一個生活碎片。")); return; }
  list.forEach(n => wall.append(noteCard(n, () => openNote(n))));
}

    const nd=parse(note.date); selected=note.date; view=new Date(nd.getFullYear(), nd.getMonth(), 1); render();
  }
  catch(e){ $("noteErr").textContent = e.message==="full" ? "裝置空間不夠了，試著刪掉一些舊的便利貼再貼上。" : "沒有存成功，請再按一次。"; }
  finally{ $("save").disabled=false; }
};
$("del").onclick = async () => {
  if(!editing || !confirm("確定要撕掉這張便利貼嗎？")) return;
  try{ await removeItem(editing); closeSheets(); }catch(e){ $("noteErr").textContent="沒有撕掉，請再試一次。"; }
};
$("prev").onclick=()=>{ view.setMonth(view.getMonth()-1); render(); };
$("next").onclick=()=>{ view.setMonth(view.getMonth()+1); render(); };
$("todayBtn").onclick=()=>{ const t=new Date(); view=new Date(t.getFullYear(),t.getMonth(),1); selected=ymd(t); render(); };

function renderThemeChips(){

function drawRainbow(){
  const pool = rcPick==="all" ? ALL_CARDS : ALL_CARDS.filter(c => c.theme === rcPick);

const wait = ms => new Promise(r => setTimeout(r, ms));
async function playGacha(color){
  const out=$("outCap"); out.style.setProperty("--cc", color);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches || !out.animate) return;
  out.getAnimations({subtree:true}).forEach(a => a.cancel());
  out.hidden=true;
  $("knob").animate([{transform:"rotate(0)"},{transform:"rotate(360deg)"}], {duration:1000, easing:"cubic-bezier(.45,0,.25,1)"});
  document.querySelectorAll("#dome .cap").forEach((c,i) => {
    const r=+c.dataset.r, dx=()=>Math.random()*50-25, dy=()=>-(20+Math.random()*70);
    c.animate([
      {transform:`translate(0,0) rotate(${r}deg)`},
      {transform:`translate(${dx()}px,${dy()}px) rotate(${r+100+Math.random()*120}deg)`, offset:.3},
      {transform:`translate(${dx()}px,${dy()/2}px) rotate(${r+220}deg)`, offset:.6},
      {transform:`translate(0,-6px) rotate(${r+330}deg)`, offset:.85},
      {transform:`translate(0,0) rotate(${r+360}deg)`}
    ], {duration:1100+Math.random()*300, delay:i*25, easing:"ease-in-out"});
  });
  await wait(1050);
  out.hidden=false;
  await out.animate([
    {transform:"translateY(-34px) rotate(-40deg)", opacity:0},
    {transform:"translateY(-22px) rotate(-10deg)", opacity:1, offset:.18},
    {transform:"translateY(0) rotate(200deg)", offset:.55, easing:"ease-out"},
    {transform:"translateY(-13px) rotate(270deg)", offset:.72, easing:"ease-in"},
    {transform:"translateY(0) rotate(330deg)", offset:.86, easing:"ease-out"},
    {transform:"translateY(-3px) rotate(352deg)", offset:.94},
    {transform:"translateY(0) rotate(360deg)"}
  ], {duration:900, fill:"forwards"}).finished;
  await out.animate([{transform:"rotate(360deg)"},{transform:"rotate(348deg)"},{transform:"rotate(370deg)"},{transform:"rotate(360deg)"}], {duration:380, fill:"forwards"}).finished;
  await wait(200);
  const ease={duration:400, easing:"cubic-bezier(.2,.8,.3,1.25)", fill:"forwards"};

  await out.querySelector(".b").animate([{transform:"none"},{transform:"translate(9px,6px) rotate(18deg)"}], ease).finished;
  await wait(250);
  await out.animate([{opacity:1},{opacity:0}], {duration:250, fill:"forwards"}).finished;
}

function renderPlanet(){
  const ns=notes(), days=new Set(ns.map(n=>n.date)).size;
  const placed=ns.filter(n=>n.place).length, quests=ns.filter(n=>n.quest);
  const study=ns.some(n=>(n.tags||[]).some(t=>/學|讀|書|課/.test(t)));
  const rainbow=ns.some(n=>n.mood===5);
  const level=1+Math.floor(days/5);
  $("planetTitle").textContent = `我的小星球・第 ${level} 級`;
  const objs=[];
  const trees=Math.min(days,9), flowers=Math.min(placed,8);
  for(let i=0;i<trees;i++) objs.push("🌳");
  for(let i=0;i<flowers;i++) objs.push(["🌸","🌷","🌼"][i%3]);
  if(days>=7) objs.push("🏠");
  if(study) objs.push("📚");
  if(ns.length>=15) objs.push("🐇");
  if(ns.length>=30) objs.push("🐈");
  if(!objs.length) objs.push("🌱");
  // 交錯排列
  const mixed=[]; const a=objs.slice(); while(a.length){ mixed.push(a.shift()); if(a.length) mixed.push(a.pop()); }
  const cx=150, cy=185, r=92;
  let svg=`<svg viewBox="0 0 300 300" role="img" aria-label="小星球上有 ${trees} 棵樹、${flowers} 朵花、${quests.length} 顆星星"><g class="bob">`;
  const stars=Math.min(quests.length,14);
  for(let i=0;i<stars;i++){ const x=20+((i*67)%260), y=18+((i*41)%70); svg+=`<text x="${x}" y="${y}" font-size="14">⭐</text>`; }
  if(rainbow) svg+=`<text x="210" y="70" font-size="34">🌈</text>`;
  svg+=`<ellipse cx="${cx}" cy="${cy+r+12}" rx="80" ry="8" fill="var(--dot)"/>`;
  svg+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--sage)"/>`;
  svg+=`<circle cx="${cx-30}" cy="${cy+20}" r="16" fill="var(--sage-d)" opacity=".5"/><circle cx="${cx+35}" cy="${cy+45}" r="10" fill="var(--sage-d)" opacity=".5"/><circle cx="${cx+20}" cy="${cy-5}" r="7" fill="var(--sage-d)" opacity=".4"/>`;
  svg+=`<ellipse cx="${cx}" cy="${cy}" rx="${r+30}" ry="16" fill="none" stroke="var(--w4)" stroke-width="5" transform="rotate(-12 ${cx} ${cy})" opacity=".85"/>`;
  const n=mixed.length, span=Math.min(150, 30+n*14);
  mixed.forEach((e,i)=>{
    const ang = n===1 ? -90 : -90 - span/2 + span*i/(n-1);
    const rad=ang*Math.PI/180, x=cx+Math.cos(rad)*(r+4), y=cy+Math.sin(rad)*(r+4);
    svg+=`<text x="${x}" y="${y}" font-size="24" text-anchor="middle" transform="rotate(${ang+90} ${x} ${y})">${e}</text>`;
  });
  svg+=`</g></svg>`;
  $("planetSvg").innerHTML=svg;
  const st=$("planetStats"); st.innerHTML="";
  [[days,"記錄天數"],[ns.length,"生活碎片"],[quests.length,"收藏卡"]].forEach(([v,l])=>{ const d=el("div"); d.append(el("b",null,v), el("span",null,l)); st.append(d); });
  $("cardsTitle").textContent = `生活收藏卡（${quests.length} / ${QUESTS.length} 種）`;
  const cards=$("cards"); cards.innerHTML="";
  if(!quests.length){ cards.append(el("p","empty","完成日記頁上方的小冒險，就能收集到第一張卡。")); return; }
  quests.sort((a,b)=>b.date.localeCompare(a.date)).forEach(nq=>{
    const q=questFor(nq.date), c=el("div","qcard"); c.style.background=moodOf(nq).c;
    c.append(el("span","e",q[0]), el("span",null,q[1]), el("small",null,nq.date.replace(/-/g,"/")));
    cards.append(c);
  });
}

function lastWeek(){

  for(let i=6;i>=0;i--){ const d=new Date(t); d.setDate(t.getDate()-i); out.push(ymd(d)); }
  return out;
}

function compressPhoto(f){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const sc = Math.min(1, 1000 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      let q = .8, d = c.toDataURL("image/jpeg", q);
      while(d.length > 260000 && q > .35){ q -= .1; d = c.toDataURL("image/jpeg", q); }
      URL.revokeObjectURL(url); res(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("read")); };
    img.src = url;
  });
}

function renderBtBest(){

}

  const changed = !!bf.shop && bf.shop !== name;
  bf.shop = name; bf.pickShop = false;
  if(changed && !bf.id){ bf.drink = ""; bf.sugar = ""; bf.ice = ""; bf.sugarCustom = false; bf.iceCustom = false; bf.autofilled = false; }
  if(!bf.drink) bf.pickDrink = true;
  renderBShop(); renderBDrink(); bShow(); bSyncChips(); bRenderLast(); bUpdateSave();
  const dq = $("drinkQ"); if(dq) setTimeout(() => $("secDrink").scrollIntoView({behavior:"smooth", block:"start"}), 30);
}
function renderBDrink(){
  const box = $("secDrink"); if(!box || !bf) return;
  if(!bf.shop){ box.innerHTML = ""; return; }
  if(bf.drink && !bf.pickDrink){
    box.innerHTML = `<div class="lg">喝了什麼</div><div class="picked"><span class="pk">${esc(bf.drink)}</span><button type="button" class="linkbtn" id="chgDrink">更換</button></div>`;
  }else{
    box.innerHTML = '<div class="lg">喝了什麼</div><input class="bin" id="drinkQ" placeholder="搜尋菜單，或直接輸入飲料名稱" autocomplete="off"><div id="drinkOpts"></div>';
    renderBDrinkOpts();
  }
}
function renderBDrinkOpts(){
  const box = $("drinkOpts"); if(!box || !bf) return;
  const q = $("drinkQ").value.trim(), nq = norm(q), hist = drinksAt(bf.shop), menu = BT_MENU[bf.shop] || [];
  const hn = new Set(hist.map(x => norm(x.name)));
  const menuRest = menu.filter(m => !hn.has(norm(m))), genRest = BT_GENERIC.filter(g => !hn.has(norm(g)) && !menu.includes(g));
  const match = s => !nq || norm(s).includes(nq);
  const all = hist.map(x => x.name).concat(menu, BT_GENERIC).map(norm);
  let h = "";
  if(q && !all.includes(nq)) h += useChip("pickdrink", q);
  const hs = hist.filter(x => match(x.name));
  if(hs.length) h += '<div class="mlabel">你在這間喝過的</div><div class="bchips">' + hs.map(x => optChip("pickdrink", x.name, x.avg ? `<span class="fav">★${x.avg}</span>` : "")).join("") + "</div>";
  const ms = menuRest.filter(match);
  if(ms.length) h += `<div class="mlabel">${esc(bf.shop)} 的菜單</div><div class="bchips">` + ms.map(m => optChip("pickdrink", m)).join("") + "</div>";
  if(!menu.length && !q) h += '<div class="mlabel">這間店的菜單還沒收錄，可以從常見飲料選，或直接輸入名稱</div>';
  const showGen = !menu.length || nq || bf.genOpen, gs = genRest.filter(match);
  if(showGen && gs.length) h += '<div class="mlabel">常見飲料</div><div class="bchips">' + gs.map(g => optChip("pickdrink", g)).join("") + "</div>";
  if(menu.length && !nq) h += `<div class="bchips" style="margin-top:10px"><button type="button" class="chip" data-togglegen="1">${bf.genOpen ? "收起常見飲料 ▴" : "更多常見飲料 ▾"}</button></div>`;
  box.innerHTML = h;
}
function pickDrinkB(name){
  name = String(name || "").trim(); if(!name || !bf) return;
  bf.drink = name; bf.pickDrink = false; bf.autofilled = false;
  if(!bf.id && !bf.sugar && !bf.ice){
    const last = findLast(bf.shop, name, null);
    if(last){ bf.sugar = last.sugar || ""; bf.ice = last.ice || ""; bf.sugarCustom = !!bf.sugar && !SUGAR.includes(bf.sugar); bf.iceCustom = !!bf.ice && !ICE.includes(bf.ice); bf.autofilled = true; }
  }
  renderBDrink(); bShow(); bSyncChips(); bRenderLast(); bUpdateSave();
  setTimeout(() => { const s = $("secSpec"); if(s) s.scrollIntoView({behavior:"smooth", block:"start"}); }, 30);
}
function bRenderLast(){
  const box = $("lastBox"); if(!box || !bf) return;
  const last = findLast(bf.shop, bf.drink, bf.id);
  if(!bf.drink || !last){ box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  box.innerHTML = `<b>上次（${esc(fmtMD(last.date))}）</b>：${esc(last.sugar || "－")}、${esc(last.ice || "－")}${last.stars ? "，" + last.stars + " 顆星" : ""}` +
    (last.note ? `<small>${esc(last.note)}</small>` : "") + (bf.autofilled ? "<small>已幫你帶入上次的甜度和冰塊，可以直接修改</small>" : "");
}
function bSyncChips(fromInput){
  if(!bf) return;
  const sh = $("btSheet");
  sh.querySelectorAll("[data-sugar]").forEach(b => b.setAttribute("aria-pressed", String(!bf.sugarCustom && b.dataset.sugar === bf.sugar)));
  sh.querySelectorAll("[data-ice]").forEach(b => b.setAttribute("aria-pressed", String(!bf.iceCustom && b.dataset.ice === bf.ice)));
  const sc = sh.querySelector("[data-sugarcustom]"), ic = sh.querySelector("[data-icecustom]");
  if(sc) sc.setAttribute("aria-pressed", String(bf.sugarCustom)); if(ic) ic.setAttribute("aria-pressed", String(bf.iceCustom));
  const si = $("bSugar"), ii = $("bIce");
  if(si){ si.hidden = !bf.sugarCustom; if(!fromInput && si.value !== (bf.sugarCustom ? bf.sugar : "")) si.value = bf.sugarCustom ? bf.sugar : ""; }
  if(ii){ ii.hidden = !bf.iceCustom; if(!fromInput && ii.value !== (bf.iceCustom ? bf.ice : "")) ii.value = bf.iceCustom ? bf.ice : ""; }
  sh.querySelectorAll("[data-star]").forEach(b => b.classList.toggle("on", +b.dataset.star <= bf.stars));
  const sl = $("starLbl"); if(sl) sl.textContent = bf.stars ? STARTXT[bf.stars] : "";
}
async function saveBt(){
  if(bf.bt){
    const sq = $("shopQ"), dq = $("drinkQ");
    if(!bf.shop && sq && sq.value.trim()){ bf.shop = sq.value.trim(); bf.pickShop = false; }
    if(!bf.drink && dq && dq.value.trim()){ bf.drink = dq.value.trim(); bf.pickDrink = false; }
    if(!bf.shop){ $("bErr").textContent = "先選一間店，或把「加入手搖紀錄」關掉。"; return; }
    if(!bf.drink){ renderBShop(); renderBDrink(); bShow(); $("bErr").textContent = "再選一下喝了什麼。"; return; }
  }
  const date = $("bDate").value, time = $("bTime").value || nowHM();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ $("bErr").textContent = "請選擇日期。"; return; }
  if(date > ymd(new Date())){ $("bErr").textContent = "日期不能比今天晚，請重新選擇。"; return; }
  const prev = bf.id ? items.find(x => x.id === bf.id) : null;
  const icon = bf.icon || (bf.bt ? "🧋" : "🥤");
  const it = {...(prev || {id:newId("d"), kind:"drink", created:Date.now()}), kind:"drink", icon, note:$("bNote").value.trim(), date, time,
    ...(bf.bt ? {shop:bf.shop, name:bf.drink, sugar:bf.sugar || "", ice:bf.ice || "", stars:bf.stars || 0}
              : {shop:"", name:$("uName").value.trim(), sugar:"", ice:"", stars:0}),
    ...(bPhoto.changed ? {photoId:"", photoRef: bPhoto.removed ? null : bPhoto.ref} : {})};
  $("bSave").disabled = true;
  try{
    await persist(it); bPhoto = {changed:false, removed:false, ref:null}; closeSheets();
    const nd = parse(date); dSel = date; dView = new Date(nd.getFullYear(), nd.getMonth(), 1); render();
    toast(it.shop ? `已記下 ${icon} ${it.shop}・${it.name}` : `已記錄 ${icon} ${it.name || dName(icon) || "飲料"}`);
  }catch(e){ $("bErr").textContent = "沒有存成功，請再按一次。"; const s = $("bSave"); if(s) s.disabled = false; }
}

/* 擲骰子 */
function poolList(){
  const used = shopsByUse();
  if(dicePool === "mine") return used;
  if(dicePool === "fav") return used.filter(s => bts().some(e => e.shop === s && e.stars >= 4));
  return used.concat(BT_SHOPS.filter(p => !used.includes(p)));
}
function favEntry(shop){ let best = null; btSorted().forEach(e => { if(e.shop === shop && e.stars && (!best || e.stars > best.stars)) best = e; }); return best; }
function openDice(){
  closeBt(); diceOpen = true; diceResult = null;
  $("btSheet").innerHTML = `<h3 id="btTitle">今天喝哪間？</h3><div class="lg">從哪裡抽</div><div class="bchips" id="poolChips"></div>
    <div class="dice-stage"><div class="dice-face" id="diceFace">🎲</div><div class="dice-name" id="diceName">按下「擲骰子」</div><div class="dice-sub" id="diceSub"></div></div>
    <div class="actions"><button type="button" class="btn" id="dzClose">關閉</button><span class="grow"></span><button type="button" class="btn main" id="dzRoll">擲骰子</button><button type="button" class="btn" id="dzPick" disabled>就這間</button></div>`;
  renderPool(); $("btScrim").classList.add("open");
}
function renderPool(){
  $("poolChips").innerHTML = [["all","全部店家"],["mine","我喝過的店"],["fav","我給 4 星以上的店"]]
    .map(o => `<button type="button" class="chip" data-pool="${o[0]}" aria-pressed="${dicePool === o[0]}">${o[1]}</button>`).join("");
}
function resetDice(){
  diceResult = null; $("diceFace").classList.remove("rolling"); $("diceName").textContent = "按下「擲骰子」"; $("diceSub").textContent = "";
  $("dzRoll").disabled = false; $("dzRoll").textContent = "擲骰子"; $("dzRoll").className = "btn main"; $("dzPick").disabled = true; $("dzPick").className = "btn";
}
function roll(){
  const list = poolList();
  if(!list.length){ $("diceName").textContent = "這個範圍還沒有店家"; $("diceSub").textContent = "先記幾杯（給 4 顆星以上），這裡就會有名單了"; return; }
  clearTimeout(diceTimer);
  const final = list[Math.floor(Math.random() * list.length)];
  const steps = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 16; let i = 0;
  $("dzRoll").disabled = true; $("dzPick").disabled = true; $("diceSub").textContent = ""; $("diceFace").classList.add("rolling");
  const finish = () => {
    diceResult = final; $("diceFace").classList.remove("rolling"); $("diceName").textContent = final;
    const fe = favEntry(final);
    $("diceSub").textContent = fe ? `你在這間的最愛：${fe.name}（${fe.sugar || "－"}、${fe.ice || "－"}）` : "還沒在這間記過，去試試看吧";
    $("dzRoll").disabled = false; $("dzRoll").textContent = "再擲一次"; $("dzRoll").className = "btn";
    $("dzPick").disabled = false; $("dzPick").className = "btn main";
  };
  const tick = () => { if(!diceOpen) return; if(i >= steps){ finish(); return; } $("diceName").textContent = list[Math.floor(Math.random() * list.length)]; i++; diceTimer = setTimeout(tick, 40 + i * i * 1.1); };
  tick();
}

/* 事件（表單與骰子共用同一個面板） */
$("btSheet").addEventListener("click", ev => {
  const t = ev.target.closest("button"); if(!t) return; const ds = t.dataset;
  if(diceOpen){
    if(ds.pool){ dicePool = ds.pool; clearTimeout(diceTimer); renderPool(); resetDice(); return; }
    if(t.id === "dzRoll"){ roll(); return; }
    if(t.id === "dzPick" && diceResult){ const shop = diceResult, fe = favEntry(shop); openBt(null, fe ? {shop, drink:fe.name, sugar:fe.sugar, ice:fe.ice} : {shop}); return; }
    if(t.id === "dzClose"){ closeSheets(); return; }
    return;
  }
  if(!bf) return;
  if(ds.uicon !== undefined){ bf.icon = ds.uicon; renderUIcons(); return; }
  if(t.id === "bCancel"){ closeSheets(); return; }
  if(t.id === "bSave"){ saveBt(); return; }
  if(t.id === "bDel"){ if(confirm("要刪除這杯手搖的紀錄嗎？")){ const id = bf.id; closeSheets(); removeItem(id); toast("已刪除"); } return; }
  if(t.id === "chgShop"){ bf.pickShop = true; renderBShop(); const q = $("shopQ"); if(q) q.focus(); return; }
  if(t.id === "chgDrink"){ bf.pickDrink = true; renderBDrink(); const q = $("drinkQ"); if(q) q.focus(); return; }
  if(t.id === "bRmPhoto"){ if(bPhoto.ref) idbDel(bPhoto.ref); bPhoto = {changed:true, removed:true, ref:null}; $("bPrev").hidden = true; $("bPrev").removeAttribute("src"); t.hidden = true; return; }
  if(ds.pickshop !== undefined){ pickShop(ds.pickshop); return; }
  if(ds.pickdrink !== undefined){ pickDrinkB(ds.pickdrink); return; }
  if(ds.togglegen){ bf.genOpen = !bf.genOpen; renderBDrinkOpts(); return; }
  if(ds.sugar !== undefined){ bf.sugarCustom = false; bf.sugar = bf.sugar === ds.sugar ? "" : ds.sugar; bf.autofilled = false; bSyncChips(); bRenderLast(); return; }
  if(ds.ice !== undefined){ bf.iceCustom = false; bf.ice = bf.ice === ds.ice ? "" : ds.ice; bf.autofilled = false; bSyncChips(); bRenderLast(); return; }
  if(ds.sugarcustom){ bf.sugarCustom = true; if(SUGAR.includes(bf.sugar)) bf.sugar = ""; bSyncChips(); const a = $("bSugar"); if(a) a.focus(); return; }
  if(ds.icecustom){ bf.iceCustom = true; if(ICE.includes(bf.ice)) bf.ice = ""; bSyncChips(); const c = $("bIce"); if(c) c.focus(); return; }
  if(ds.star){ const n = +ds.star; bf.stars = bf.stars === n ? 0 : n; bSyncChips(); return; }
});
$("btSheet").addEventListener("input", ev => {
  if(!bf) return; const id = ev.target.id;
  if(id === "shopQ") renderBShopOpts();
  if(id === "drinkQ") renderBDrinkOpts();
  if(id === "bSugar"){ bf.sugar = ev.target.value.trim(); bSyncChips(true); }
  if(id === "bIce"){ bf.ice = ev.target.value.trim(); bSyncChips(true); }
  if(id === "uEmoji"){ const v = ev.target.value.trim(); if(v){ bf.icon = lastEmoji(v); renderUIcons(); } }
});
$("btSheet").addEventListener("focusout", ev => { if(ev.target.id === "uEmoji" && bf) ev.target.value = bf.icon; });
$("btSheet").addEventListener("keydown", ev => {
  if(ev.key !== "Enter" || !bf) return;
  if(ev.target.id === "shopQ"){ ev.preventDefault(); pickShop(ev.target.value); }
  else if(ev.target.id === "drinkQ"){ ev.preventDefault(); pickDrinkB(ev.target.value); }
});
$("btSheet").addEventListener("change", async ev => {
  if(ev.target.id === "uBt" && bf){
    const on = ev.target.checked, nm = $("uName").value.trim(); bf.bt = on; $("bErr").textContent = "";
    if(on){ if(bf.icon === "🥤") bf.icon = "🧋"; if(!bf.drink && nm){ bf.drink = nm; bf.pickDrink = false; } }
    else if(!nm && bf.drink) $("uName").value = bf.drink;
    renderUIcons(); renderBShop(); renderBDrink(); bShow(); bSyncChips(); bRenderLast(); applyMode();
    return;
  }
  if(ev.target.id !== "bPhoto" || !bf) return;
  const f = ev.target.files[0]; ev.target.value = ""; if(!f) return;
  try{
    const d = await compressPhoto(f); if(!bf) return;
    if(bPhoto.ref) idbDel(bPhoto.ref);
    const ref = newId("p"); await idbSet(ref, d);
    bPhoto = {changed:true, removed:false, ref};
    $("bPrev").src = d; $("bPrev").hidden = false; $("bRmPhoto").hidden = false; $("bErr").textContent = "";
  }catch(err){ $("bErr").textContent = "這張照片讀不出來，換一張試試。"; }
});

/* ---------- 設定與備份 ---------- */
function openSettings(msg){
  $("cfgUrl").value = cfg.url; $("cfgKey").value = cfg.key; $("cfgErr").textContent = msg || "";
  $("setScrim").classList.add("open");
}
$("gear").onclick = () => openSettings();
$("cfgClose").onclick = closeSheets;
$("cfgSave").onclick = async () => {
  const url = $("cfgUrl").value.trim(), key = $("cfgKey").value;
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(url)){ $("cfgErr").textContent = "網址要是 https://script.google.com/macros/s/…/exec 這種格式。"; return; }
  if(!key){ $("cfgErr").textContent = "請輸入密碼。"; return; }
  cfg = {url, key}; lsSet(LS.cfg, cfg);
  $("cfgSave").disabled = true; $("cfgErr").textContent = "連線中…";
  syncState = "idle"; await sync();
  $("cfgSave").disabled = false;
  if(syncState === "idle") closeSheets();
  else if(syncState === "offline") $("cfgErr").textContent = "目前沒有網路，連上網路後會自動同步。";
  else if(syncState === "error") $("cfgErr").textContent = "連線失敗，請確認網址是否正確。";
};
$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify({app:"日常收藏家", version:1, exported:new Date().toISOString(), items}, null, 2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `日常收藏家_備份_${ymd(new Date())}.json`;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  $("cfgErr").textContent = `已匯出 ${items.length} 筆。`;
};
$("importFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if(!f) return;
  try{
    const data = JSON.parse(await f.text());
    const fromBt = e => ({id:"bt" + (e.id || newId("")), kind:"drink", icon:"🧋", shop:e.shop || "", name:e.drink || "", sugar:e.sugar || "", ice:e.ice || "", stars:e.stars || 0, note:e.note || "", date:e.date || ymd(new Date()), time:"", created:e.ts || Date.now()});
    const arr = Array.isArray(data) ? data : (data.items || (Array.isArray(data.entries) ? data.entries.map(fromBt) : null));
    if(!Array.isArray(arr)) throw 0;
    const ok = arr.filter(x => x && x.id && (x.kind === "letter" || x.date));
    ok.forEach(x => {
      x.kind = x.kind || "note"; delete x.photo; delete x.photoRef;
      const i = items.findIndex(y => y.id === x.id); if(i >= 0) items[i] = x; else items.push(x);
      queue = queue.filter(q => !(q.op==="save" && q.item.id===x.id)).concat({op:"save", item:x});
    });
    saveLocal(); render(); showStatus(); $("cfgErr").textContent = `已匯入 ${ok.length} 筆。`; sync();
  }catch(err){ $("cfgErr").textContent = "這個檔案看起來不是日常收藏家的備份檔。"; }
};
$("logoutBtn").onclick = () => {
  const n = queue.length;
  if(!confirm(n ? `還有 ${n} 筆還沒同步到 Google 試算表，登出會一起清除。確定要登出嗎？` : "登出後，這台裝置上的密碼和暫存資料會清除，Google 試算表裡的日記不受影響。確定嗎？")) return;
  Object.values(LS).forEach(k => localStorage.removeItem(k)); idbClear();
  items = []; queue = []; cfg = {url:API_DEFAULT, key:""}; syncState = "idle";
  render(); showStatus(); openSettings("已登出這台裝置。");
};

loadLocal(); render(); showStatus();
if(cfg.key) sync(); else setTimeout(() => openSettings("輸入密碼，就能連接你的 Google 試算表。也可以先關閉，之後再從右上角的 ⚙️ 設定。"), 300);
addEventListener("online", () => sync());
addEventListener("offline", () => { syncState = "offline"; showStatus(); });
document.addEventListener("visibilitychange", () => { if(!document.hidden && Date.now() - lastSync > 30000) sync(); });
if("serviceWorker" in navigator){
  const hadController = !!navigator.serviceWorker.controller;
  // 有新版時自動重新載入（正在編輯或同步時先不打斷，下次打開就是新版）
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if(!hadController || syncing || document.querySelector(".scrim.open")) return;
    location.reload();
  });
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
